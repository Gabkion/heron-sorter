<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Sorter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>window.JSZip || document.write('<script src="./libraries/jszip.min.js"><\\/script>')</script>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <div id="small-screen-msg" class="small-screen-msg">
    expand page or<br>load on a computer to use
  </div>

  <div id="app" class="app">
    <header class="top-bar">
      <div class="model-controls">
        <div class="url-row">
          <input id="model-url" class="model-input" type="text" placeholder="Paste model link here" />
          <button id="load-model-btn" class="btn load-btn" type="button">LOAD MODEL</button>
        </div>
        <button id="upload-zip-btn" class="btn upload-btn" type="button" title="Upload a Teachable Machine model export (.zip)">
          UPLOAD MODEL (.ZIP)
        </button>
        <input id="zip-file-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden />
      </div>

      <button id="connect" class="btn connect-btn" type="button">CONNECT ARDUINO</button>
    </header>

    <main class="main-content">
      <div class="title-block">
        <h1 class="title">ML Sorter</h1>
        <p class="subtitle">Arduino + Teachable Machine</p>
      </div>

      <section class="classifier-row">
        <button id="class2-box" class="class-box class-box-left hidden" type="button" title="Click to rename class">
          <img class="pencil-icon" src="./assets/pencil_icon.png" alt="Edit" />
          <span id="class2-label" class="class-label class-label-right"></span>
        </button>

        <div class="meter-column">
          <div class="classification-bar" aria-label="Classification confidence bar">
            <div id="bar-left" class="bar-fill bar-fill-left"></div>
            <div id="bar-right" class="bar-fill bar-fill-right"></div>
            <div class="bar-divider"></div>
            <div id="threshold-left" class="threshold-diamond"></div>
            <div id="threshold-right" class="threshold-diamond"></div>
          </div>

          <div id="threshold-text" class="threshold-text">Threshold: 90%</div>
          <input id="confidence-slider" class="confidence-slider" type="range" min="50" max="99" value="90" step="1" />
        </div>

        <button id="class1-box" class="class-box class-box-right hidden" type="button" title="Click to rename class">
          <span id="class1-label" class="class-label class-label-left"></span>
          <img class="pencil-icon" src="./assets/pencil_icon.png" alt="Edit" />
        </button>
      </section>

      <section class="sorter-stage">
        <div id="left-grid" class="photo-grid" aria-label="Class 2 recent detections"></div>

        <div class="camera-wrapper">
          <div class="camera-fallback">
            enable webcam access<br>and refresh page to use
          </div>
          <video id="webcam" class="webcam-video" autoplay muted playsinline></video>
          <img class="camera-border" src="./assets/camera_border.png" alt="" />
        </div>

        <div id="right-grid" class="photo-grid" aria-label="Class 1 recent detections"></div>
      </section>
    </main>

    <button id="instructions-btn" class="btn instructions-btn" type="button">INSTRUCTIONS</button>
  </div>

  <script src="serial.js"></script>
  <script src="app.js"></script>
</body>

</html>
